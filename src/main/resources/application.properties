spring.application.name=ProfileManagerSpringBoot

# ----------------------------------------------------------------
# Database Connection (Supabase Transaction Pooler)
# ----------------------------------------------------------------
# Fallback JDBC URL provided if SUPABASE_DB_URL environment variable is not present
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres.lqcdfepbmpqljoygrdnu}
spring.datasource.password=${SUPABASE_DB_PASSWORD:MammaMia098=_=}
spring.datasource.driver-class-name=org.postgresql.Driver

# Multipart upload limits (avatar file uploads)
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# ----------------------------------------------------------------
# Supabase Storage & REST API
# ----------------------------------------------------------------
# HTTP REST API URL (Project Settings -> API -> Project URL)
app.supabase.url=${SUPABASE_URL:https://lqcdfepbmpqljoygrdnu.supabase.co}

# Secret API key (bypasses RLS for backend server operations)
app.supabase.secret-key=${SUPABASE_SECRET_KEY:sb_secret_u0WtseKOCOQ193mN2gQLKQ_D3fqNSD_}

# Public storage bucket for avatars
app.supabase.avatar-bucket=${SUPABASE_AVATAR_BUCKET:avatars}

# ----------------------------------------------------------------
# JPA / Hibernate & Connection Pooler (Supavisor) Settings
# ----------------------------------------------------------------
# Disable Hibernate autocommit management for PgBouncer / Supavisor pooler
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.connection.autocommit=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Disable JTA Platform to avoid commit/rollback interference
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Server Configuration
server.port=${PORT:8080}
spring.thymeleaf.cache=false